<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USM Connect - Matches</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="navbar">
    <div class="brand"><span class="dot"></span><span class="brand-text">USM Connect</span></div>
    <nav>
      <a href="/discover.html" class="navlink">Discover</a>
      <a href="/matches.html" class="navlink active">Matches</a>
      <a href="/friends.html" class="navlink">Friends</a>
      <a href="/messages.html" class="navlink">Messages</a>
      <a href="/profile.html" class="navlink">Profile</a>
      <a href="#" class="navlink" id="logoutLink">Log Out</a>
    </nav>
  </div>

  <div class="main">
    <h1 style="margin-bottom:4px;">Your Matches</h1>
    <p class="helper-text">People who liked you back. Reach out and meet up around campus!</p>
    <div id="grid"><div class="loader"></div></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  document.getElementById("logoutLink").addEventListener("click", async (e) => {
    e.preventDefault();
    await Api.post("/api/logout");
    window.location.href = "/index.html";
  });

  async function init() {
    const user = await requireAuth();
    if (!user) return;
    const matches = await Api.get("/api/matches");
    const grid = document.getElementById("grid");

    if (matches.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <span class="big-emoji">💌</span>
          <h2>No matches yet</h2>
          <p>Head to Discover and start liking profiles you vibe with.</p>
        </div>`;
      return;
    }

    grid.innerHTML = `<div class="matches-grid">${matches.map(cardHtml).join("")}</div>`;
  }

  function cardHtml(u) {
    const tags = (u.commonInterests || []).slice(0, 3)
      .map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
    return `
      <div class="mini-card">
        <div class="mini-photo">
          ${u.photoPath ? `<img src="${escapeHtml(u.photoPath)}" alt="${escapeHtml(u.fullName)}">`
                         : `<span class="avatar-fallback">🎓</span>`}
        </div>
        <div class="mini-body">
          <h3>${escapeHtml(u.fullName)}</h3>
          <div class="meta">${escapeHtml(u.course || "")} · ${escapeHtml(u.yearLevel || "")} · ${u.compatibility}% match</div>
          <div class="tag-row">${tags}</div>
          <a class="btn btn-primary btn-sm btn-block" href="/chat.html?with=${encodeURIComponent(u.id)}">💬 Message</a>
        </div>
      </div>`;
  }

  init();
</script>
</body>
</html>
